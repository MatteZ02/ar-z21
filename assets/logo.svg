<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.6" stop-color="#2b5a6e"/>
      <stop offset="1" stop-color="#3d6f78"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f63"/>
      <stop offset="1" stop-color="#34383c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe6ea"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8de"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4f66"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.35" stop-color="#ffd25a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redglow">
      <stop offset="0" stop-color="#ffd0dc"/>
      <stop offset="0.3" stop-color="#ff3b5c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff2050" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="140" cy="120" r="5"/><circle cx="300" cy="80" r="4"/>
    <circle cx="760" cy="110" r="5"/><circle cx="900" cy="190" r="4"/>
    <circle cx="610" cy="60" r="3"/><circle cx="420" cy="150" r="3"/>
  </g>
  <!-- Mountains -->
  <path d="M0 560 L150 380 L250 470 L370 330 L470 450 L560 360 L690 500 L800 370 L920 470 L1024 400 L1024 620 L0 620 Z" fill="#4f8597"/>
  <path d="M370 330 L410 378 L388 372 L370 392 L350 372 L332 378 Z M800 370 L838 414 L816 410 L800 428 L784 410 L764 414 Z M150 380 L182 418 L163 414 L150 430 L136 414 L118 418 Z" fill="#e8f3f6"/>

  <!-- Ground / ballast -->
  <path d="M0 600 L1024 600 L1024 1024 L0 1024 Z" fill="url(#ground)"/>

  <!-- Headlight beams on track -->
  <path d="M430 700 L560 700 L760 1024 L240 1024 Z" fill="url(#beam)"/>

  <!-- Sleepers -->
  <g fill="#3b2a22" stroke="#1a1410" stroke-width="5" stroke-linejoin="round">
    <path d="M440 770 L584 770 L590 790 L434 790 Z"/>
    <path d="M418 830 L606 830 L614 856 L410 856 Z"/>
    <path d="M392 900 L632 900 L642 934 L382 934 Z"/>
    <path d="M360 984 L664 984 L676 1024 L348 1024 Z"/>
  </g>
  <!-- Rails -->
  <g stroke="#cfd6db" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M466 720 L330 1030"/>
    <path d="M558 720 L694 1030"/>
  </g>
  <g stroke="#1a1f23" stroke-width="5" fill="none">
    <path d="M474 720 L339 1030"/>
    <path d="M550 720 L685 1030"/>
  </g>

  <!-- Catenary gantry -->
  <g stroke="#10202b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <rect x="96" y="210" width="34" height="420" rx="8" fill="#b9c3c9"/>
    <rect x="894" y="210" width="34" height="420" rx="8" fill="#b9c3c9"/>
    <rect x="80" y="196" width="864" height="52" rx="12" fill="#c9d2d7"/>
  </g>
  <g stroke="#10202b" stroke-width="7" fill="none" stroke-linejoin="round">
    <path d="M140 244 L180 200 L220 244 L260 200 L300 244 L340 200 L380 244 L420 200 L460 244 L500 200 L540 244 L580 200 L620 244 L660 200 L700 244 L740 200 L780 244 L820 200 L860 244"/>
  </g>
  <!-- Contact wire + hangers -->
  <g stroke="#10202b" stroke-width="6" stroke-linecap="round">
    <path d="M60 300 L964 300"/>
    <path d="M300 248 L300 300"/><path d="M512 248 L512 300"/><path d="M724 248 L724 300"/>
  </g>

  <!-- Signal -->
  <g transform="translate(40 0)">
  <g stroke="#10202b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <rect x="196" y="470" width="22" height="330" rx="6" fill="#8c959b"/>
    <rect x="170" y="790" width="74" height="34" rx="8" fill="#9aa3a8"/>
    <rect x="150" y="380" width="114" height="170" rx="40" fill="#22303a"/>
  </g>
  <circle cx="207" cy="430" r="70" fill="url(#redglow)"/>
  <circle cx="207" cy="430" r="26" fill="#ff3355" stroke="#10202b" stroke-width="7"/>
  <circle cx="198" cy="421" r="8" fill="#ffd6de"/>
  <circle cx="207" cy="500" r="20" fill="#3a4a54" stroke="#10202b" stroke-width="6"/>

    </g>

  <!-- Pantograph -->
  <g stroke="#10202b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M512 382 L456 342 L512 304 L568 342 Z"/>
    <path d="M460 300 L564 300"/>
  </g>

  <!-- Locomotive body -->
  <g stroke="#10202b" stroke-width="12" stroke-linejoin="round">
    <!-- roof -->
    <rect x="388" y="372" width="248" height="34" rx="14" fill="#9fb0ba"/>
    <!-- main body -->
    <path d="M372 430 Q378 396 416 396 L608 396 Q646 396 652 430 L664 572 L692 612 L694 722 Q694 744 670 744 L354 744 Q330 744 330 722 L332 612 L360 572 Z" fill="url(#body)"/>
    <!-- windshield -->
    <path d="M402 440 Q406 422 424 422 L600 422 Q618 422 622 440 L636 540 Q638 558 620 558 L404 558 Q386 558 388 540 Z" fill="url(#glass)"/>
    <path d="M360 572 L664 572" fill="none" stroke-width="8"/>
  </g>
  <!-- windshield glint + wiper -->
  <path d="M432 438 L478 438 L438 544 L406 544 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M498 438 L520 438 L486 544 L470 544 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M512 552 L560 470" stroke="#10202b" stroke-width="6" stroke-linecap="round"/>

  <!-- stripe -->
  <path d="M336 618 L688 618 L690 662 L334 662 Z" fill="#1f8fa6" stroke="#10202b" stroke-width="8" stroke-linejoin="round"/>
  <path d="M336 640 L688 640" stroke="#ff8a3d" stroke-width="10"/>

  <!-- skirt / buffers -->
  <g stroke="#10202b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M360 744 L664 744 L650 790 L374 790 Z" fill="#2d3a42"/>
    <rect x="362" y="752" width="56" height="26" rx="10" fill="#6b7880"/>
    <rect x="606" y="752" width="56" height="26" rx="10" fill="#6b7880"/>
    <rect x="490" y="760" width="44" height="34" rx="6" fill="#4b575e"/>
  </g>

  <!-- headlights -->
  <circle cx="408" cy="702" r="64" fill="url(#glow)"/>
  <circle cx="616" cy="702" r="64" fill="url(#glow)"/>
  <circle cx="512" cy="388" r="46" fill="url(#glow)"/>
  <circle cx="408" cy="702" r="22" fill="#fff3b8" stroke="#10202b" stroke-width="7"/>
  <circle cx="616" cy="702" r="22" fill="#fff3b8" stroke="#10202b" stroke-width="7"/>
  <rect x="490" y="378" width="44" height="20" rx="8" fill="#fff3b8" stroke="#10202b" stroke-width="6"/>
</svg>
